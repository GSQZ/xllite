name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for release signing." >&2
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/keystore/xllite-release.jks

      - name: Build APK
        env:
          storeFile: keystore/xllite-release.jks
          storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '_')"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/xinli-lite-${version}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xinli-lite-android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios-unsigned:
    name: iOS unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '_')"
          rm -rf dist
          mkdir -p dist/Payload
          ditto build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          (
            cd dist
            ditto -c -k --sequesterRsrc --keepParent Payload "xinli-lite-ios-${version}-unsigned.ipa"
          )
          rm -rf dist/Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xinli-lite-ios-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - ios-unsigned
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
